[project]
name = "cliniai_v2"
version = "0.1.0"
description = "Medical appointment chatbot — CliniAI v2 (Cliniweb, LangGraph, Instructor)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "openai>=1.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "litellm>=1.50",
    "instructor>=1.5",
    "httpx>=0.27",
    "numpy>=1.26",
    "langgraph>=1.2.2",
    "logfire[fastapi,httpx]>=4.37.0",
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
