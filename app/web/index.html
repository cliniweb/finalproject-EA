<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CliniAI — Asistente Médico</title>
<style>
  :root {
    color-scheme: light;
    --bg: #eef3f8;
    --panel: #ffffff;
    --panel-2: #f1f5f9;
    --accent: #0284c7;
    --accent-2: #4f46e5;
    --text: #1e293b;
    --muted: #64748b;
    --user-bubble: linear-gradient(135deg, #2563eb, #4f46e5);
    --bot-bubble: #e2e8f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(1200px 800px at 80% -10%, #dbeafe 0%, var(--bg) 55%);
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .app {
    width: min(760px, 96vw);
    height: min(860px, 94vh);
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid #cbd5e1;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(15, 23, 42, .15);
  }
  header {
    padding: 18px 24px;
    background: var(--panel-2);
    border-bottom: 1px solid #cbd5e1;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .logo {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    font-size: 22px;
  }
  header h1 { font-size: 17px; font-weight: 600; }
  header p { font-size: 12px; color: var(--muted); }
  .status-dot {
    margin-left: auto; display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--muted);
  }
  .status-dot::before {
    content: ""; width: 9px; height: 9px; border-radius: 50%;
    background: #22c55e; box-shadow: 0 0 8px #22c55e;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  .msg { display: flex; gap: 10px; max-width: 85%; animation: pop .25s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    display: grid; place-items: center; font-size: 17px;
    background: var(--panel-2); border: 1px solid #cbd5e1;
  }
  .msg.user .avatar { background: linear-gradient(135deg, #2563eb, #4f46e5); border: none; }
  .bubble {
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.bot .bubble { background: var(--bot-bubble); border-bottom-left-radius: 4px; }
  .msg.user .bubble { background: var(--user-bubble); color: #ffffff; border-bottom-right-radius: 4px; }
  .bubble a { color: var(--accent); font-weight: 600; }
  .booking-card {
    align-self: center;
    background: linear-gradient(135deg, #d1fae5, #a7f3d0);
    border: 1px solid #10b981;
    border-radius: 16px;
    padding: 18px 22px;
    text-align: center;
    animation: pop .3s ease;
    color: #065f46;
  }
  .booking-card h3 { font-size: 15px; margin-bottom: 8px; }
  .booking-card a {
    display: inline-block; margin-top: 6px;
    background: #059669; color: #ffffff; text-decoration: none;
    padding: 9px 18px; border-radius: 10px; font-weight: 700; font-size: 14px;
  }
  .typing { display: flex; gap: 5px; padding: 14px 16px; }
  .typing span {
    width: 8px; height: 8px; border-radius: 50%; background: var(--muted);
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  .quick {
    padding: 0 24px 10px;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .quick button {
    background: var(--panel-2); color: var(--text);
    border: 1px solid #cbd5e1; border-radius: 999px;
    padding: 7px 14px; font-size: 12.5px; cursor: pointer;
    transition: all .15s;
  }
  .quick button:hover { border-color: var(--accent); color: var(--accent); }
  footer {
    padding: 16px 24px 20px;
    background: var(--panel-2);
    border-top: 1px solid #cbd5e1;
    display: flex; gap: 10px;
  }
  #input {
    flex: 1;
    background: var(--panel);
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    padding: 13px 16px;
    color: var(--text);
    font-size: 14.5px;
    outline: none;
    transition: border-color .15s;
  }
  #input:focus { border-color: var(--accent); }
  #input:disabled { background: var(--panel-2); color: var(--muted); cursor: not-allowed; }
  #send {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none; border-radius: 12px;
    width: 52px; cursor: pointer;
    display: grid; place-items: center;
    font-size: 19px; color: #ffffff;
    transition: transform .1s;
  }
  #send:hover { transform: scale(1.05); }
  #send:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  #reset {
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 12px; margin-left: auto;
  }
  #reset:hover { color: #f87171; }
  .doctor-list {
    align-self: flex-start;
    flex-shrink: 0;               /* don't let the chat flex column squash it */
    display: flex; flex-direction: column; gap: 8px;
    width: 85%;
    max-height: min(340px, 45vh);
    overflow-y: auto;
    padding: 4px;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    animation: pop .25s ease;
  }
  .doctor-list button {
    flex-shrink: 0;
    background: var(--panel);
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    padding: 11px 15px;
    text-align: left;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
    transition: all .15s;
  }
  .doctor-list button:hover { border-color: var(--accent); background: #f0f9ff; }
  .doctor-list .doc-name { font-weight: 600; }
  .doctor-list .doc-spec { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">🩺</div>
    <div>
      <h1>CliniAI — Asistente Médico</h1>
      <p>Cuénteme sus síntomas y le encontraré un médico</p>
    </div>
    <div class="status-dot">en línea <button id="reset" title="Reiniciar conversación">↺ reiniciar</button></div>
  </header>

  <div id="chat"></div>

  <div class="quick" id="quick">
    <button>Me duele el pecho al respirar</button>
    <button>Tengo una erupción en la piel</button>
    <button>Busco un pediatra para mi hijo</button>
    <button>Dolor de cabeza constante</button>
  </div>

  <footer>
    <input id="input" placeholder="Describa sus síntomas o escriba su mensaje…" autocomplete="off" />
    <button id="send" title="Enviar">➤</button>
  </footer>
</div>

<script>
const chat  = document.getElementById("chat");
const input = document.getElementById("input");
const send  = document.getElementById("send");
const quick = document.getElementById("quick");

let sessionId = crypto.randomUUID();
let busy = false;

function setInputLocked(locked, placeholder) {
  input.disabled = locked;
  send.disabled = locked;
  input.placeholder = locked
    ? (placeholder || "Seleccione una opción de la lista…")
    : "Describa sus síntomas o escriba su mensaje…";
  if (!locked) input.focus();
}

function addMsg(role, text, noScroll = false) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = `
    <div class="avatar">${role === "user" ? "🙂" : "🩺"}</div>
    <div class="bubble"></div>`;
  div.querySelector(".bubble").textContent = text;
  chat.appendChild(div);
  if (!noScroll) chat.scrollTop = chat.scrollHeight;
  return div;
}

function addBookingCard(url) {
  const div = document.createElement("div");
  div.className = "booking-card";
  div.innerHTML = `
    <h3>✅ ¡Cita confirmada!</h3>
    <p style="font-size:13px;color:#047857">Complete su reserva en el siguiente enlace:</p>
    <a href="${url}" target="_blank" rel="noopener">Finalizar reserva →</a>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addDoctorList(doctors) {
  const div = document.createElement("div");
  div.className = "doctor-list";
  for (const d of doctors) {
    const prefix = d.sexo === "F" ? "Dra." : "Dr.";
    const btn = document.createElement("button");
    const name = document.createElement("span");
    name.className = "doc-name";
    name.textContent = `🩺 ${prefix} ${d.nombre}`;
    const spec = document.createElement("span");
    spec.className = "doc-spec";
    spec.textContent = d.especialidad || "Medicina general";
    btn.append(name, spec);
    btn.addEventListener("click", () => {
      div.remove();
      setInputLocked(false);
      sendMessage(`Quiero agendar con ${prefix} ${d.nombre}`);
    });
    div.appendChild(btn);
  }
  chat.appendChild(div);
  setInputLocked(true, "Seleccione un médico de la lista…");
}

function addLocationList(locations) {
  const div = document.createElement("div");
  div.className = "doctor-list";
  for (const loc of locations) {
    const btn = document.createElement("button");
    const name = document.createElement("span");
    name.className = "doc-name";
    name.textContent = `📍 ${loc.nombre}`;
    btn.appendChild(name);
    btn.addEventListener("click", () => {
      div.remove();
      setInputLocked(false);
      sendMessage(loc.nombre);
    });
    div.appendChild(btn);
  }
  chat.appendChild(div);
  setInputLocked(true, "Seleccione una localidad de la lista…");
}

function addQuickReplies(options) {
  const div = document.createElement("div");
  div.className = "doctor-list";
  for (const opt of options) {
    const btn = document.createElement("button");
    const name = document.createElement("span");
    name.className = "doc-name";
    name.textContent = opt;
    btn.appendChild(name);
    btn.addEventListener("click", () => {
      div.remove();
      setInputLocked(false);
      sendMessage(opt);
    });
    div.appendChild(btn);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
  const div = document.createElement("div");
  div.className = "msg bot";
  div.id = "typing";
  div.innerHTML = `<div class="avatar">🩺</div>
    <div class="bubble typing"><span></span><span></span><span></span></div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
function hideTyping() { document.getElementById("typing")?.remove(); }

async function sendMessage(text) {
  if (!text.trim() || busy) return;
  busy = true;
  send.disabled = true;
  quick.style.display = "none";
  addMsg("user", text);
  input.value = "";
  showTyping();

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    hideTyping();
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      addMsg("bot", err.detail || "Lo siento, ocurrió un error. Intente de nuevo.");
      return;
    }
    const data = await res.json();
    const hasList = data.suggestions?.length > 0;
    const hasLocations = data.locations?.length > 0;
    const introEl = data.reply ? addMsg("bot", data.reply, hasList || hasLocations) : null;
    if (hasList) addDoctorList(data.suggestions);
    if (hasLocations) addLocationList(data.locations);
    if (data.quick_replies?.length > 0) addQuickReplies(data.quick_replies);
    if (data.reply_footnote) addMsg("bot", data.reply_footnote, hasList);
    if (data.completed && data.booking_url) addBookingCard(data.booking_url);
    // Conversation finished: the booking link is the final action — remove any
    // lingering clickable lists and lock the chat permanently.
    if (data.completed) {
      document.querySelectorAll(".doctor-list").forEach((el) => el.remove());
      setInputLocked(true, "Conversación finalizada — use 'Nueva conversación' para empezar de nuevo");
    }
    // Anchor the view at the START of the response so the explanation is read first.
    if ((hasList || hasLocations) && introEl) introEl.scrollIntoView({ behavior: "smooth", block: "start" });
  } catch {
    hideTyping();
    addMsg("bot", "No pude conectar con el servidor. ¿Está corriendo la API?");
  } finally {
    busy = false;
    if (!input.disabled) {
      send.disabled = false;
      input.focus();
    }
  }
}

send.addEventListener("click", () => sendMessage(input.value));
input.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(input.value); });
quick.addEventListener("click", (e) => {
  if (e.target.tagName === "BUTTON") sendMessage(e.target.textContent);
});
document.getElementById("reset").addEventListener("click", async () => {
  await fetch(`/chat/${sessionId}`, { method: "DELETE" }).catch(() => {});
  sessionId = crypto.randomUUID();
  chat.innerHTML = "";
  quick.style.display = "flex";
  setInputLocked(false);
  greet();
});

function addConsentButtons() {
  const div = document.createElement("div");
  div.className = "quick";
  div.id = "consent-buttons";
  div.innerHTML = `
    <button data-consent="yes">✅ SÍ, acepto</button>
    <button data-consent="no">❌ NO</button>`;
  div.addEventListener("click", (e) => {
    const c = e.target.dataset?.consent;
    if (c) answerConsent(c === "yes");
  });
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  setInputLocked(true, "Responda con los botones SÍ / NO…");
}

async function answerConsent(accepted) {
  if (busy) return;
  busy = true;
  document.getElementById("consent-buttons")?.remove();
  addMsg("user", accepted ? "SÍ, acepto" : "NO");
  showTyping();
  try {
    const res = await fetch("/chat/consent", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, accepted }),
    });
    hideTyping();
    const data = await res.json();
    if (data.reply) addMsg("bot", data.reply);
    if (accepted) {
      quick.style.display = "flex";
      setInputLocked(false);
    } else {
      addConsentButtons(); // let the patient change their mind (keeps input locked)
    }
  } catch {
    hideTyping();
    addMsg("bot", "No pude conectar con el servidor. ¿Está corriendo la API?");
    addConsentButtons();
  } finally {
    busy = false;
  }
}

function greet() {
  addMsg("bot",
    "¡Hola! 👋 Soy CliniAI, su asistente médico.\n\n" +
    "Antes de continuar, necesito su consentimiento explícito para procesar " +
    "sus datos personales y de salud con el fin de gestionar su cita médica.\n\n" +
    "¿Acepta?");
  quick.style.display = "none";
  addConsentButtons();
}
greet();
input.focus();
</script>
</body>
</html>
